name: Deploy to GitHub Pages

# Runs after every merge to main. Docs-only merges skip the deploy.
# Requires: Settings → Pages → Source = "GitHub Actions".
# The site is served at https://<owner>.github.io/<repo>/, so the Vite `base` must be `/<repo>/` (set in T01).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pkg
        run: echo "has_pkg=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Until T01 adds the app, publish a placeholder so the Pages pipeline is proven end to end.
      - name: Placeholder site
        if: steps.pkg.outputs.has_pkg != 'true'
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html><html lang="zh-Hant"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>300 Tang Tangles</title>
          <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#f3ead8;color:#2b2420;font-family:serif;text-align:center">
          <div><h1 style="font-size:3rem;margin:0">床前明月光</h1><p>300 Tang Tangles: coming soon.</p></div>
          </body></html>
          EOF

      - uses: pnpm/action-setup@v4
        if: steps.pkg.outputs.has_pkg == 'true'
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.has_pkg == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Build app
        if: steps.pkg.outputs.has_pkg == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # SPA fallback so deep links work on Pages
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
